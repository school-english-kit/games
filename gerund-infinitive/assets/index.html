<style>

ter-events:none;transform:rotate(2deg) scale(1.04);opacity:.94;margin:0}.hint{font-size:clamp(11px,1vw,13px);line-height:1.35;max-width:245px;font-weight:600;background:#fff9e4b8;border-radius:12px;padding:5px}.feedback{font-size:clamp(12px,1.3vw,16px);min-height:23px;font-weight:800}.feedback.bad{color:#b0503f}.footer{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.2vw,28px);min-height:0}.image-button{background:none;border:0;padding:0;display:block;width:clamp(117px,15vw,178px);line-height:0;transition:transform .12s,filter .12s;cursor:pointer}.image-button img{width:100%;height:auto;display:block;object-fit:contain}.image-button:hover{transform:translateY(-2px)}.image-button:active{transform:translateY(1px)}.image-button:focus-visible{outline:3px solid #416e32;border-radius:15px}.image-button[hidden]{display:none!important}.finish{width:100%;border:2px solid #b9c98b;background:#fff8e7eb;border-radius:22px;padding:15px 8px;box-shadow:0 6px 16px #384f2e1b;display:none}.finish h2{margin:0 0 9px;font-size:clamp(19px,2vw,25px)}.finish p{margin:4px;font-size:clamp(12px,1.1vw,15px)}.finish .image-button{margin:10px auto 0;width:min(100%,180px)}.finish .prompt{font-size:12px;font-weight:600;margin-top:9px}.center.done .active-sticker,.center.done .hint,.center.done .feedback{display:none}.center.done .finish{display:block}.overlay{position:fixed;inset:0;z-index:900;background:#1b2d1e91;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(3px)}.overlay.show{display:flex}.popup{width:min(94vw,740px);position:relative;aspect-ratio:784/502;background:url('ui/question_popup.png') center/contain no-repeat;filter:drop-shadow(0 12px 23px #12271255)}.popup-close{position:absolute;top:2%;right:3%;width:14%;height:23%;border:0;background:transparent;border-radius:50%;cursor:pointer;z-index:3}.popup-close:focus-visible{outline:3px solid #2e6525}.popup-content{position:absolute;left:12%;right:12%;top:39%;height:31%;display:fl </style></head>
<body><div class="shell">
<header class="header"><img class="banner" src="assets/header.png" alt="Gerund or Infinitive: Grammar Sorting. Sort the stickers into four groups. Then click on any sticker, read the question and answer it."></header>
<main class="board" id="board">
<section class="zone zone-ing" data-type="ing" tabindex="0" role="button" aria-label="Gerund -ing: choose this group"><div class="zone-inner"><div class="zone-heading"><span class="zone-title">Gerund (-ing)</span><span class="count">0</span></div><div class="tags"></div></div></section>
<section class="zone zone-to" data-type="to" tabindex="0" role="button" aria-label="To-infinitive: choose this group"><div class="zone-inner"><div class="zone-heading"><span class="zone-title">To-infinitive</span><span class="count">0</span></div><div class="tags"></div></div></section>
<section class="zone zone-bare" data-type="bare" tabindex="0" role="button" aria-label="Without to: choose this group"><div class="zone-inner"><div class="zone-heading"><span class="zone-title">Without to</span><span class="count">0</span></div><div class="tags"></div></div></section>
<section class="zone zone-both" data-type="both" tabindex="0" role="button" aria-label="Both forms: choose this group"><div class="zone-inner"><div class="zone-heading"><span class="zone-title">Both forms</span><span class="count">0</span></div><div class="tags"></div></div></section>
<div class="center" id="center"><div class="progress" id="progress" aria-live="polite">0 / 51 sorted</div><div class="active-sticker" id="current" tabindex="0" role="button" aria-label="Current grammar sticker; drag to a group">enjoy</div><div class="hint">Drag the sticker or tap a group.</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="finish" id="finish"><h2>🎉 All sorted!</h2><p id="result"></p><p class="prompt">Tap any sorted sticker to answer its question.</p><button class="image-button" id="play-again" type="button" aria-label="Start again"><img src="ui/button_start_again.png" alt="Start again"></button></div></div>
</main><footer class="footer"><a class="image-button" href="https://vk.ru/school_english_kit" target="_blank" rel="noopener noreferrer" aria-label="More materials"><img src="ui/button_more_materials.png" alt="More materials"></a><button type="button" id="restart" class="image-button" aria-label="Restart"><img src="ui/button_restart.png" alt="Restart"></button></footer></div>
<div class="overlay" id="overlay" role="presentation"><div class="popup" role="dialog" aria-modal="true" aria-label="Let's talk! Question"><button class="popup-close" id="close-popup" type="button" aria-label="Close question"></button><div class="popup-content" id="popup-content"></div></div></div>
<script>
(()=>{'use strict';
// Data: 51 unique grammar stickers. Each sorted sticker opens its own speaking question.
const ing=[
['enjoy','What do you enjoy doing after school?'],["don’t mind","What household chores don’t you mind doing?"],['dislike','What do you dislike doing at school?'],['avoid','What do you try to avoid doing before bed?'],['appreciate','Do you appreciate your friends helping you with homework?'],['be used to','Are you used to getting up early?'],['consider','Have you ever considered learning a new language?'],['deny','Have you ever denied doing something wrong?'],['fancy','Do you fancy going out with your friends this weekend?'],['imagine','Can you imagine living without your phone?'],['miss','What do you miss doing during the school holidays?'],['suggest','What do you suggest doing on a rainy day?'],['practise','What skill do you practise regularly?'],['prevent ... from','What prevents you from spending more time outdoors?'],['spend time/money on','What do you spend most of your pocket money on?'],['How about ...?','How about trying a new hobby this month?'],["it’s worth",'What place in your city is worth visiting?'],["can’t stand","What can’t you stand doing?"],['have difficulty','What do you have difficulty remembering?'],['look forward to','What are you looking forward to doing this weekend?'],["can’t help","What funny videos can’t you help laughing at?"],['after prepositions','What do you usually do before going to bed?']
];
const to=[['would like','What country would you like to visit?'],['would prefer','Would you prefer to study online or at school?'],['would love','What famous person would you love to meet?'],['too + adjective','Are you ever too tired to do your homework?'],['adjective + enough','Are you old enough to travel alone?'],['ask','What do your parents usually ask you to do?'],['decide','What have you recently decided to learn?'],['explain','Can you explain how to make your favourite snack?'],['want','What do you want to do next weekend?'],['hope','What do you hope to achieve this school year?'],['expect','What do you expect to do after school today?'],['promise','What do you often promise to do but forget?'],['refuse','What food do you refuse to eat?'],['plan','What do you plan to do during your next holidays?']];
const bare=[['make someone','What do your parents make you do at home?'],['let someone','What do your parents let you do at weekends?'],['can / could','What can you do really well?'],['must / should','What should teenagers do to stay healthy?']];
const both=[
['like','What do you like doing with your friends?','What do you like to do first when you get home?','нравится процесс','привычка'],
['love','What do you love doing on holiday?','How do you love to celebrate your birthday?','любимое занятие','предпочитаемый способ'],
['hate','What do you hate doing around the house?','Do you hate to tell people bad news?','неприятное занятие','неприятно делать'],
['prefer','Do you prefer studying alone or with friends?','Would you prefer to watch a film or play a game tonight?','общее предпочтение','конкретный выбор'],
['continue','Do you continue using your phone after bedtime?','Would you like to continue to study English after school?','продолжать действие','то же значение'],
['begin','When did you begin learning English?','When did you begin to use social media?','начало действия','то же значение'],
['start','When did you start using your first smartphone?','What time do you usually start to do your homework?','начало действия','то же значение'],
['stop','What bad habit would you like to stop doing?','When you’re walking home, do you ever stop to buy a snack?','прекратить действие','остановиться с целью'],
['forget','Will you ever forget meeting your best friend for the first time?','What do you often forget to take to school?','память о прошлом','забыть сделать'],
['remember','Do you remember going to school for the first time?','What do you always remember to do before leaving home?','воспоминание','не забыть сделать'],
['try','Have you ever tried learning English through video games?','What difficult skill are you trying to learn at the moment?','попробовать способ','прилагать усилия']
];
const deck=[...ing.map(([t,q])=>({t,q,c:'ing'})),...to.map(([t,q])=>({t,q,c:'to'})),...bare.map(([t,q])=>({t,q,c:'bare'})),...both.map(([t,q1,q2,meaning1,meaning2])=>({t,q1,q2,meaning1,meaning2,c:'both'}))];
const $=id=>document.getElementById(id),zones=[...document.querySelectorAll('.zone')];let items=[],i=0,firstTry=0,errors=0,wrongOnThis=false,drag=null,ghost=null,lastFocus=null;
function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function restart(){items=shuffle([...deck]);i=0;firstTry=0;errors=0;wrongOnThis=false;zones.forEach(z=>{z.querySelector('.tags').replaceChildren();z.querySelector('.count').textContent='0';z.classList.remove('over','wrong','positive')});$('center').classList.remove('done');$('feedback').textContent='';$('overlay').classList.remove('show');$('current').hidden=false;render()}
function render(){const isDone=i>=items.length;$('progress').textContent=`${i} / ${items.length} sorted`;$('center').classList.toggle('done',isDone);if(isDone){$('result').textContent=`${firstTry} / ${items.length} correct on the first try · ${errors} ${errors===1?'mistake':'mistakes'}.`;return}$('current').textContent=items[i].t;$('feedback').textContent='';$('feedback').classList.remove('bad');wrongOnThis=false}
function choose(z){if(i>=items.length||$('overlay').classList.contains('show'))return;let item=items[i];if(z.dataset.type!==item.c){errors++;wrongOnThis=true;$('feedback').textContent='Not quite! Try another group.';$('feedback').classList.add('bad');z.classList.add('wrong');setTimeout(()=>z.classList.remove('wrong'),360);return}if(!wrongOnThis)firstTry++;const tag=document.createElement('button');tag.type='button';tag.className='tag';tag.textContent=item.t;tag.setAttribute('aria-label',`${item.t}: open speaking question`);tag.addEventListener('click',e=>{e.stopPropagation();openQuestion(item)});tag.addEventListener('pointerdown',e=>e.stopPropagation());z.querySelector('.tags').append(tag);z.querySelector('.count').textContent=z.querySelectorAll('.tag').length;i++;render()}
zones.forEach(z=>{z.addEventListener('click',e=>{if(e.target.closest('.tag'))return;choose(z)});z.addEventListener('keydown',e=>{if(e.target!==z)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(z)}})});
function textEl(name,text,cl){const el=document.createElement(name);if(cl)el.className=cl;el.textContent=text;return el}
function openQuestion(item){lastFocus=document.activeElement;const box=$('popup-content');box.replaceChildren();box.classList.toggle('two',item.c==='both');box.append(textEl('div',item.t,'popup-word'));if(item.c==='both'){[[item.q1,item.meaning1,'-ing'],[item.q2,item.meaning2,'to + verb']].forEach(([q,meaning,label])=>{let part=textEl('div','','pair');part.append(textEl('div',label,'explanation'),textEl('p',q,'question'),textEl('div',`(${meaning})`,'explanation'));box.append(part)})}else{box.append(textEl('p',item.q,'question'))}box.scrollTop=0;$('overlay').classList.add('show');$('close-popup').focus()}
function closeQuestion(){$('overlay').classList.remove('show');if(lastFocus?.isConnected)lastFocus.focus()}
$('close-popup').addEventListener('click',closeQuestion);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeQuestion()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('show'))closeQuestion()});
// Drag moves a clone, not the source; on correct drop the next sticker appears immediately.
const sticker=$('current');sticker.addEventListener('pointerdown',e=>{if(i>=items.length||e.button!==0||$('overlay').classList.contains('show'))return;const rect=sticker.getBoundingClientRect();drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,dx:e.clientX-rect.left,dy:e.clientY-rect.top,w:rect.width,h:rect.height,moved:false};sticker.setPointerCapture(e.pointerId)});
sticker.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<7)return;if(!drag.moved){drag.moved=true;ghost=sticker.cloneNode(true);ghost.removeAttribute('id');ghost.removeAttribute('tabindex');ghost.classList.add('drag-ghost');ghost.style.width=drag.w+'px';ghost.style.height=drag.h+'px';document.body.append(ghost);sticker.style.visibility='hidden'}ghost.style.left=(e.clientX-drag.dx)+'px';ghost.style.top=(e.clientY-drag.dy)+'px';zones.forEach(z=>z.classList.toggle('over',inside(z,e.clientX,e.clientY)))});
function inside(z,x,y){const r=z.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}function endDrag(e){if(!drag||drag.id!==e.pointerId)return;const target=drag.moved?zones.find(z=>inside(z,e.clientX,e.clientY)):null;drag=null;ghost?.remove();ghost=null;sticker.style.visibility='';zones.forEach(z=>z.classList.remove('over'));if(target)choose(target)}sticker.addEventListener('pointerup',endDrag);sticker.addEventListener('pointercancel',endDrag);
sticker.addEventListener('keydown',e=>{let map={ArrowUp:'ing',ArrowRight:'to',ArrowLeft:'bare',ArrowDown:'both'};if(map[e.key]){e.preventDefault();choose(zones.find(z=>z.dataset.type===map[e.key]))}});
$('restart').addEventListener('click',restart);$('play-again').addEventListener('click',restart);restart();
})();
</script></body></html>
