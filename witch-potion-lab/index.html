];
const cats=['01-glow','02-colour','03-happy','04-bubble','05-sleepy','06-bouncy','07-tiny','08-flying','09-invisible','10-party'];const storageKey='witch-potion-lab-v1';let index=0,earned=[],events=[],boardItem=null,selected=null,busy=false,locked=false,sound=true,audio=null,lastCat=null;
try{const s=JSON.parse(localStorage.getItem(storageKey));if(s){earned=Array.isArray(s.earned)?s.earned.filter(x=>Number.isInteger(x)&&x>=0&&x<10):[];index=Math.min(9,Math.max(0,Number(s.index)||0));sound=s.sound!==false;lastCat=Number.isInteger(s.lastCat)&&s.lastCat>=0&&s.lastCat<10?s.lastCat:(earned.length?earned[earned.length-1]:null)}}catch{}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({index,earned,sound,lastCat}))}catch{}}
function asset(item){return './assets/ingredients/'+item.id+(item.state?'-'+item.state:'')+'.png'}
function initAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}
function tone(freq,start,duration,type='sine',volume=.07,end=freq){if(!audio||!sound)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime+start);o.frequency.exponentialRampToValueAtTime(Math.max(1,end),audio.currentTime+start+duration);g.gain.setValueAtTime(.001,audio.currentTime+start);g.gain.exponentialRampToValueAtTime(volume,audio.currentTime+start+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+start+duration);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+start);o.stop(audio.currentTime+start+duration+.02)}
function noise(duration,volume=.03){if(!audio||!sound)return;const b=audio.createBuffer(1,audio.sampleRate*duration,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter();s.buffer=b;f.type='lowpass';f.frequency.value=1800;g.gain.value=volume;s.connect(f);f.connect(g);g.connect(audio.destination);s.start()}
function fx(type){initAudio();if(!sound)return;if(type==='add')tone(450,0,.2,'sine',.12,80);if(type==='cut'){noise(.16);tone(180,.13,.08,'triangle',.03)}if(type==='peel')noise(.35,.025);if(type==='stir')for(let i=0;i<8;i++)tone(140+i%2*80,i*.24,.15,'sine',.035,90);if(type==='boil')for(let i=0;i<18;i++)tone(180+Math.random()*350,i*.16,.12,'sine',.04,80);if(type==='success')[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.5,'sine',.08));if(type==='error')tone(220,0,.4,'triangle',.08,55)}
function status(text){$('status').textContent=text}function history(){const counts=new Map();for(const e of events){if(e.type!=='add')continue;const key=e.id+'|'+e.state;const old=counts.get(key);if(old)old.count++;else counts.set(key,{...e,count:1})}const states={'cut':'cut','peeled':'peeled','peeled-cut':'peeled, cut'};$('history').innerHTML=counts.size?[...counts.values()].map(e=>`<span class="contents-chip">${e.count} × ${e.state?states[e.state]+' ':''}${names[e.id].toLowerCase()}</span>`).join(''):'<span class="contents-empty">Empty — add your ingredients!</span>'}
const potionMeta={"07-tiny": [1254, 1254, 245, 131, 764, 1003], "03-happy": [1254, 1254, 191, 80, 872, 1101], "05-sleepy": [1254, 1254, 265, 78, 724, 1105], "02-colour": [1254, 1254, 232, 102, 796, 1046], "09-invisible": [1254, 1254, 137, 145, 981, 994], "10-party": [1254, 1254, 179, 76, 896, 1102], "01-glow": [1254, 1254, 205, 74, 841, 1090], "08-flying": [1254, 1254, 137, 112, 980, 1055], "06-bouncy": [1254, 1254, 212, 79, 830, 1092], "04-bubble": [1254, 1254, 294, 69, 666, 1131]};function potionArt(name){const [w,h,x,y,bw,bh]=potionMeta[name];return `<svg class="potion-image" viewBox="${x} ${y} ${bw} ${bh}" aria-hidden="true"><image href="./assets/potions/${name}.png" width="${w}" height="${h}"/></svg>`}
function renderCollection(){ $('collection').innerHTML="<svg class=\"collection-art\" viewBox=\"11 260 2142 195\" aria-hidden=\"true\"><image href=\"./assets/decor/potion-shelf-v2.png\" width=\"2164\" height=\"727\"/></svg>"+levels.map((l,i)=>`<div class="potion ${earned.includes(i)?'earned':''}" style="--potion:${l.color}" title="${l.name} Potion${earned.includes(i)?' — collected':''}">${potionArt(cats[i])}<span>${l.name}</span></div>`).join('')}
function renderBoard(){const old=$('board').querySelector('.board-item');old?.remove();if(boardItem){const img=document.createElement('img');img.className='board-item';img.src=asset(boardItem);img.alt=(boardItem.state||'Whole')+' '+names[boardItem.id];img.draggable=true;img.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','board'));img.addEventListener('click',e=>{e.stopPropagation();select('board')});installTouchDrag(img,'board');$('board').append(img)}}
function select(id){if(busy||locked)return;selected=id;document.querySelectorAll('.ingredient').forEach(b=>b.classList.toggle('selected',b.dataset.id===id));status(id==='board'?'Tap the pot to add your prepared ingredient.':names[id]+': drag it, or tap the pot / board.');$('cauldron').classList.add('target');$('board').classList.add('target')}
function deselect(){selected=null;document.querySelectorAll('.selected').forEach(b=>b.classList.remove('selected'));$('cauldron').classList.remove('target');$('board').classList.remove('target')}
function transfer(id,target){if(!id||busy||locked)return;if(target==='board'){if(id==='board')return;if(boardItem){status('The board is full. Move the ingredient to the pot or click Clear.');return}boardItem={id,state:''};renderBoard();status('Use Cut or Peel, then move the ingredient to the pot.')}else{const item=id==='board'?boardItem:{id,state:''};if(!item)return;events.push({type:'add',...item});if(id==='board'){boardItem=null;renderBoard()}fx('add');status('Added '+names[item.id].toLowerCase()+'.');const s=document.createElement('div');s.className='spark';s.textContent='✦';$('cauldron').append(s);setTimeout(()=>s.remove(),650);history()}deselect()}
const cuttable=['pumpkin','apple','carrot','potato','onion','banana','lemon'],peelable=['potato','onion','banana','carrot'];
function prepare(type){if(busy||locked)return;if(!boardItem){status('Put an ingredient on the board first.');return}if(!(type==='cut'?cuttable:peelable).includes(boardItem.id)){status('You cannot '+type+' this ingredient.');return}if(boardItem.state.includes(type==='cut'?'cut':'peeled')){status('This ingredient is already '+(type==='cut'?'cut':'peeled')+'.');return}boardItem.state=type==='cut'?(boardItem.state?'peeled-cut':'cut'):(boardItem.state?'peeled-cut':'peeled');events.push({type,id:boardItem.id});renderBoard();fx(type);history();status(type==='cut'?'Cut! Move all the pieces together.':'Peeled! Follow the next step.')}
async function cook(type){if(busy||locked)return;busy=true;document.body.classList.add('busy');$('station').classList.add(type==='stir'?'stirring':'boiling');setDisabled(true);status(type==='stir'?'Stirring…':'Boiling…');fx(type);await new Promise(r=>setTimeout(r,type==='stir'?2000:3000));events.push({type});busy=false;document.body.classList.remove('busy');$('station').classList.remove('stirring','boiling');setDisabled(false);history();status(type==='stir'?'Stirred!':'Boiled!')}
function setDisabled(v){['cut','peel','stir','boil','finish','reset','clearBoard'].forEach(id=>$(id).disabled=v)}
function reset(){if(busy)return;events=[];boardItem=null;locked=false;deselect();renderBoard();history();$('cat').src='./assets/cats/'+(lastCat===null?'00-base':cats[lastCat])+'.png';status('Follow the recipe!');setDisabled(false)}
function loadLevel(){reset();$('level').textContent=`Level ${index+1} / 10`;$('recipeTitle').textContent=levels[index].name+' Potion';$('recipe').innerHTML=levels[index].steps.map(s=>'<li>'+s+'</li>').join('');renderCollection();save()}
function isCorrect(){const expected=levels[index].events;if(boardItem||events.length!==expected.length)return false;return events.every((e,i)=>{const a=expected[i];if(e.type!==a.type)return false;if(e.type==='add')return e.id===a.id&&e.state===a.state;if(e.type==='cut'||e.type==='peel'){const next=expected.slice(i+1).find(v=>v.type==='add');return next&&e.id===next.id}return true})}
function modal(html){$('modal').innerHTML=html;$('overlay').hidden=false}function closeModal(){$('overlay').hidden=true}const uiMeta={"button-sound-off": [2172, 724, 33, 114, 2106, 494], "button-continue-game": [2172, 724, 50, 108, 2072, 500], "button-see-my-potions": [2172, 724, 50, 108, 2075, 503], "button-finish": [2172, 724, 57, 108, 2058, 501], "button-start-game": [2172, 724, 58, 105, 2056, 510], "button-next-level": [2172, 724, 25, 106, 2122, 513], "in-the-pot": [2162, 727, 29, 97, 2104, 517], "button-read-recipe": [2172, 724, 79, 101, 2013, 510], "button-clear": [2172, 724, 53, 115, 2066, 473], "button-sound-on": [2172, 724, 54, 119, 2062, 483], "button-help": [2172, 724, 71, 107, 2027, 501], "community-link": [2172, 724, 71, 109, 2029, 492], "title-plaque": [2172, 724, 27, 160, 2119, 396], "button-try-again": [2172, 724, 25, 82, 2118, 553], "panel-cat": [1448, 1086, 33, 67, 1381, 936], "button-got-it": [2172, 724, 101, 105, 1970, 514], "button-reset": [2162, 727, 54, 109, 2052, 499], "panel-ingredients": [1122, 1402, 39, 56, 1045, 1296], "panel-in-the-pot": [2162, 727, 15, 14, 2131, 696], "button-play-again": [2172, 724, 37, 113, 2098, 495]};
function uiImage(name){const [w,h,x,y,bw,bh]=uiMeta[name];return `<svg viewBox="${x} ${y} ${bw} ${bh}" aria-hidden="true" focusable="false"><image href="./assets/ui/${name}.png" width="${w}" height="${h}"/></svg>`}
function buttonAsset(label){return 'button-'+label.toLowerCase().replace(/[^a-z ]/g,'').replaceAll(' ','-')}
function button(id,label,cls=''){return `<button id="${id}" class="image-button ${cls}" aria-label="${label}">${uiImage(buttonAsset(label))}</button>`}
function dressButton(id,label){const el=$(id);el.innerHTML=uiImage(buttonAsset(label));el.classList.add('image-button');el.setAttribute('aria-label',label)}

function finish(){if(busy||locked)return;if(!isCorrect()){fx('error');modal(`<h2>Oops! Something went wrong.</h2><p>Read the recipe and try again!</p><div class="modal-actions">${button('retry','Try Again')}</div>`);$('retry').onclick=()=>{closeModal();reset()};return}locked=true;lastCat=index;if(!earned.includes(index))earned.push(index);save();renderCollection();$('cat').src='./assets/cats/'+cats[index]+'.png';fx('success');modal(`<h2>Your potion is ready!</h2><p>${levels[index].name} Potion</p><img class="reward-potion" src="./assets/potions/${cats[index]}.png" alt="${levels[index].name} Potion"><div class="modal-actions">${button('next',index===9?'See My Potions':'Next Level')}</div>`);$('next').onclick=()=>{closeModal();if(index<9){index++;loadLevel()}else showCollection()}}
function showCollection(){modal(`<h2>You did it!</h2><p>You made all 10 magical potions!</p><div class="collection final-shelf">${$('collection').innerHTML}</div><div class="modal-actions">${button('view','See My Potions')}${button('again','Play Again','secondary')}</div>`);$('view').onclick=()=>{closeModal();status('Your potion collection is complete!');$('finish').disabled=true};$('again').onclick=()=>{earned=[];index=0;lastCat=null;closeModal();loadLevel()}}
function help(){modal('<h2>How to play</h2><p>Read the recipe and follow each step in order. Drag ingredients into the pot. Each drag adds one ingredient, one cup or one spoon.<br>Use the board to cut or peel. Move all the pieces into the pot together.<br>Click the whisk to stir and the flame to boil. Click Finish to test your potion.<br>Reset clears this level. Your collected potions stay safe.<br>You can also tap an ingredient, then tap the board or cauldron.</p>'+button('closeHelp','Got it!'));$('closeHelp').onclick=closeModal}
function installTouchDrag(el,id){let start=null,ghost=null,moving=false;el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||busy||locked)return;start={x:e.clientX,y:e.clientY};moving=false;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!start)return;if(!moving&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>12){moving=true;ghost=document.createElement('img');ghost.src=id==='board'?asset(boardItem):asset({id,state:''});ghost.className='drag-ghost';document.body.append(ghost)}if(ghost){e.preventDefault();ghost.style.left=e.clientX-40+'px';ghost.style.top=e.clientY-40+'px'}});el.addEventListener('pointerup',e=>{if(moving){ghost?.remove();const target=document.elementFromPoint(e.clientX,e.clientY);if(target?.closest('#cauldron'))transfer(id,'cauldron');else if(target?.closest('#board'))transfer(id,'board');setTimeout(deselect,0)}start=null;ghost=null});el.addEventListener('pointercancel',()=>{ghost?.remove();start=null;ghost=null})}
for(const [id,name]of Object.entries(names)){const b=document.createElement('button');b.className='ingredient';b.dataset.id=id;b.innerHTML=`<img src="${asset({id,state:''})}" alt=""><span>${name}</span>`;b.draggable=true;b.onclick=()=>select(id);b.addEventListener('dragstart',e=>{if(busy||locked){e.preventDefault();return}e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='copy'});installTouchDrag(b,id);$('ingredients').append(b)}
for(const target of ['cauldron','board']){const el=$(target);el.addEventListener('dragover',e=>{e.preventDefault();if(!busy)el.classList.add('target')});el.addEventListener('dragleave',()=>el.classList.remove('target'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('target');transfer(e.dataTransfer.getData('text/plain'),target)});el.addEventListener('click',e=>{if(e.target.closest('button'))return;transfer(selected,target)});el.addEventListener('keydown',e=>{if(e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();transfer(selected,target)}})}
$('cut').onclick=()=>prepare('cut');$('peel').onclick=()=>prepare('peel');$('stir').onclick=e=>{e.stopPropagation();cook('stir')};$('boil').onclick=e=>{e.stopPropagation();cook('boil')};$('reset').onclick=reset;$('finish').onclick=finish;$('clearBoard').onclick=()=>{if(busy||locked)return;boardItem=null;renderBoard();deselect();status('Board cleared. Earlier actions are still recorded. Use Reset to start this recipe again.')};$('help').onclick=help;
function renderSound(){dressButton('sound','Sound: '+(sound?'On':'Off'));$('sound').setAttribute('aria-label',sound?'Turn sound off':'Turn sound on')}$('sound').onclick=()=>{sound=!sound;initAudio();if(!sound)window.speechSynthesis?.cancel();renderSound();save()};renderSound();
$('read').onclick=()=>{if(!sound){status('Turn sound on to hear the recipe.');return}if(!('speechSynthesis'in window)){status('Recipe reading is unavailable in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(levels[index].name+' Potion. '+levels[index].steps.join(' '));u.lang='en-GB';u.rate=.85;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)};
let tipTimer;document.querySelectorAll('[data-tip]').forEach(el=>{const hide=()=>{clearTimeout(tipTimer);$('tooltip').style.display='none'};const show=()=>{tipTimer=setTimeout(()=>{const r=el.getBoundingClientRect();$('tooltip').textContent=el.dataset.tip;$('tooltip').style.left=Math.max(5,r.left)+'px';$('tooltip').style.top=Math.max(5,r.top-35)+'px';$('tooltip').style.display='block'},650)};el.addEventListener('mouseenter',show);el.addEventListener('mouseleave',hide);el.addEventListener('focus',show);el.addEventListener('blur',hide);el.addEventListener('pointerdown',show);el.addEventListener('pointerup',hide)});
document.querySelector('footer').remove();$('mainTitle').innerHTML=uiImage('title-plaque');for(const [id,label] of [['help','Help'],['finish','Finish'],['reset','Reset'],['read','Read Recipe'],['clearBoard','Clear']])dressButton(id,label);
loadLevel();modal(`<h2 class="modal-title">${uiImage('title-plaque')}</h2><p>Make 10 magical potions and discover what happens to your cat!</p><div class="hero"><img src="./assets/cats/00-base.png" alt="Cat"><img src="./assets/equipment/cauldron.png" alt="Pot"></div><p>Read the recipe and follow each step. Drag ingredients into the pot. Use the board to cut or peel them. Stir and boil when the recipe tells you to. Click Finish to test your potion!</p><div class="modal-actions">${button('start',earned.length?'Continue Game':'Start Game')}${button('restart','Play Again','secondary')}</div>`);$('restart').onclick=()=>{if(busy)return;window.speechSynthesis?.cancel();earned=[];index=0;lastCat=null;initAudio();$('game').hidden=false;closeModal();loadLevel()};$('start').onclick=()=>{initAudio();$('game').hidden=false;closeModal();if(earned.length===10)showCollection()};

function fitScene(){if(window.innerWidth>820){const scale=Math.min(window.innerWidth/1600,window.innerHeight/920);$('desktopScene').style.transform='translateX(-50%) scale('+scale+')'}else $('desktopScene').style.transform='none'}if(window.addEventListener){window.addEventListener('resize',fitScene);fitScene()}
</script></body></html>
