<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#79b63f">
<meta name="description" content="A three-round cooking game for two classmates. Choose ingredients, ask and pass the food.">
<title>Can you pass me?</title>
<style>
:root{color-scheme:light;--green:#458621;--leaf:#79b63f;--ink:#254323;--muted:#64805b;--pale:#edf7e4;--orange:#ed8b13;--ring:#f6ad36;--line:#b8d99a;--white:#fff;--shadow:0 5px 18px #426d2520;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#f6fbef url("./assets/background.png") center/cover fixed;min-width:300px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid #eb8f16;outline-offset:3px}
img{display:block;max-width:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
[hidden]{display:none!important}
.shell{width:min(1040px,calc(100% - 24px));margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 0 max(14px,env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:39px;height:39px}
h1{font-size:clamp(21px,3.6vw,34px);line-height:1.05;letter-spacing:-.8px;margin:0;font-weight:900;color:#43851d}
.round{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-top:5px;letter-spacing:.2px}
.actions{display:flex;gap:7px;flex-shrink:0}
.icon-button{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:#ffffffd9;border-radius:12px}
.icon-button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0;margin:0 0 8px;list-style:none}
.step{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#ffffffb8;color:var(--muted);font-size:14px;font-weight:700;text-align:center}
.step.current{background:#e0f1c8;border-color:#79b63f;color:#3c751d}
.step.current.pass-step{background:#fff0d4;border-color:#f1af43;color:#8c4c08}
.step.complete{background:#ebf5e0;color:#477729}
.step-number{display:inline-block;font-size:12px;margin-right:6px}
.status{margin:0 0 10px;min-height:19px;text-align:center;font-size:13px;line-height:1.4;color:var(--muted)}
.boards{display:flex;flex-direction:column;gap:12px}
.board{position:relative;border:2px solid #9cc96b;border-radius:22px;padding:12px;background:#eaf5df url("./assets/ui/player-panel.png") center/100% 100%;box-shadow:var(--shadow);isolation:isolate}
.board.active{border-color:#df9a27;box-shadow:0 0 0 2px #ffba4c45,var(--shadow)}
.board.done{border-color:#79b63f}
.board-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:31px}
.student{font-size:18px;font-weight:900;margin:0;padding:5px 12px;background:#73af39;color:#fff;border-radius:11px;white-space:nowrap}
.badge{font-size:12px;font-weight:700;border-radius:9px;padding:5px 9px;background:#ffffffa6;color:#4d7338;line-height:1.2}
.badge.turn{background:#ffedd0;color:#86500c;border:1px solid #e7ac4e}
.badge.ready{background:#dbefbf;color:#3e731e}
.count{margin-left:auto;font-size:16px;font-weight:900;white-space:nowrap;letter-spacing:.6px}
.board-inner{display:grid;gap:10px}
.summary{display:grid;grid-template-columns:74px minmax(0,1fr);align-items:center;gap:10px;min-height:83px}
.summary.with-plate{grid-template-columns:64px minmax(0,1fr) 164px}
.dish-image{width:74px;height:74px}
.with-plate .dish-image{width:64px;height:64px}
.recipe{min-width:0;display:grid;gap:7px;align-content:center}
.dish-name{margin:0;padding:7px 10px;font-size:18px;line-height:1.15;font-weight:900;background:url("./assets/ui/recipe-panel.png") center/108% 190% no-repeat;overflow-wrap:normal}
.needs{display:flex;flex-wrap:wrap;gap:4px 6px}
.recipe-entry{border:1px solid transparent;background:#ffffff80;border-radius:7px;padding:3px 6px;min-height:25px;font-size:12px;line-height:1.25;display:inline-flex;gap:5px;align-items:center;text-align:left}
.recipe-entry:disabled{opacity:1}
.recipe-entry .mini-check{width:12px;height:12px;border:1.5px solid #91aa7e;border-radius:3px;display:grid;place-items:center;flex-shrink:0;font-size:10px}
.recipe-entry.checked .mini-check{background:#68a936;border-color:#68a936;color:#fff}
.recipe-entry.requested{background:#fff0d5;border-color:#e3a039;box-shadow:0 0 0 1px #e3a039}
.recipe-entry.requested .mini-check{border-color:#dc941b;background:#fff9e8}
.plate{--plate-width:164px;width:var(--plate-width);height:calc(var(--plate-width)*.81);position:relative;flex-shrink:0;max-width:100%}
.plate-background{position:absolute;inset:0;width:100%;height:100%}
.plate-items{position:absolute;inset:19% 22%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;align-items:center;justify-items:center}
.plate-slot{width:calc(var(--plate-width)*.24);height:calc(var(--plate-width)*.24);border:1px dashed #9eb68c;border-radius:50%;background:#ffffff68;display:grid;place-items:center;min-width:0;min-height:0}
.plate-items.three .plate-slot:last-child{grid-column:1/-1}
.plate-slot.filled{border-color:transparent;background:transparent}
.plate-slot img{width:100%;height:100%;min-width:0;min-height:0}
.finished-dish{position:absolute;inset:7% 12%;width:76%;height:86%;filter:drop-shadow(0 3px 2px #374a2620)}
.inventory-area{min-width:0}
.inventory-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px;padding-left:7px;font-weight:700;font-size:12px;color:#54733d}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.food-card{position:relative;display:grid;place-items:center;min-width:0;min-height:0;height:82px;padding:6px 5px;border:1.5px solid #b8d998;border-radius:13px;background:white url("./assets/ui/food-card.png") center/100% 100%;box-shadow:0 2px 2px #577f2420;transition:transform .13s,border-color .13s,box-shadow .13s}
.food-card img{width:100%;height:100%;min-width:0;min-height:0;max-height:100%;object-fit:contain}
.food-card:not(:disabled):hover{transform:translateY(-2px);border-color:#82b446}
.food-card.selected{outline:2px solid var(--orange);outline-offset:-2px;background-color:#fff8e9}
.selected-mark{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:#ef971a;color:white;font-size:12px;display:grid;place-items:center}
.food-card.passed{border-style:dashed;box-shadow:none;background:#ffffff45}
.food-card.passed img{opacity:.2}
.food-card.passed .selected-mark{background:#69a336}
.food-card.waiting img{opacity:.7}
.board-footer{min-height:32px;margin-top:8px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.board-note{font-size:12px;color:var(--muted);margin-right:auto;padding-left:7px;line-height:1.3}
.button{position:relative;border:1px solid #6fae39;border-radius:12px;min-height:38px;padding:8px 18px;background:#90cb4b url("./assets/ui/button-green.png") center/110% 180%;font-weight:800;color:#244e13;line-height:1.2;box-shadow:0 2px 0 #64932b45}
.button:disabled{opacity:.48;box-shadow:none}
.button.orange{background-color:#ffa41a;background-image:url("./assets/ui/button-orange.png");border-color:#e79a2a;color:#673a04}
.button.plain{background:white;border-color:#bbd7a1;box-shadow:none}
.board-footer .button{min-height:33px;font-size:13px;padding:6px 16px}
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
.footer p{margin:0;color:#6a8657;font-size:12px}
.footer .button{font-size:12px;min-height:33px;padding:6px 12px}
.wrong{animation:shake .34s ease-in-out;border-color:#d38a50!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flying-food{position:fixed;pointer-events:none;z-index:1000;object-fit:contain;filter:drop-shadow(0 5px 5px #36502433)}
dialog{border:1px solid #a6cb82;border-radius:25px;padding:0;color:var(--ink);background:#fbfff7;width:min(590px,calc(100% - 32px));max-height:calc(100dvh - 32px);box-shadow:0 24px 90px #1d3f2240;overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:#21441e66;backdrop-filter:blur(4px)}
.dialog-content{padding:24px}
.dialog-content h2{font-size:27px;line-height:1.12;margin:0 0 12px;color:#3f7e20}
.dialog-content p{font-size:15px;line-height:1.55;margin:0 0 18px}
.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-weight:800;color:#739150;font-size:11px;margin-bottom:9px}
.instructions{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.instructions li{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.45}
.instruction-number{flex-shrink:0;display:grid;place-items:center;border-radius:8px;width:25px;height:25px;background:#e2f1ce;color:#4d7b2b;font-weight:900}
.instruction-copy p{margin-bottom:12px}
.speaking-model{display:block;width:fit-content;max-width:100%;margin-top:5px;padding:6px 10px;border-radius:9px;background:#e7f3d7;color:#35661c;font-size:15px;font-weight:800}
.desktop-only{display:none}
.dialog-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:20px}
.dialog-actions .button{min-width:100px}
.dish-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center;margin-top:15px}
.dish-pair img{width:100%;height:115px}
.dish-pair h3{font-size:15px;margin:8px 0 4px}
.dish-pair p{font-size:12px;color:var(--muted);margin:0}
.confetti-star{font-size:38px;line-height:1;color:#86b449;display:block;margin-bottom:13px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:860px) and (hover:hover) and (pointer:fine){
body{height:100dvh;overflow:hidden}
.shell{width:calc(100% - 48px);max-width:1800px;height:100dvh;min-height:0;padding:clamp(12px,2vh,24px) 0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:clamp(6px,1vh,12px)}
.topbar,.steps,.status{margin:0}
.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,30px);min-height:0;align-items:stretch}
.board{padding:clamp(12px,1.25vw,24px);border-radius:24px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(8px,1.2vh,14px);min-height:0}
.board-header{margin:0;gap:9px}
.student{font-size:clamp(18px,1.6vw,25px)}
.badge{font-size:clamp(11px,1vw,14px)}
.count{font-size:clamp(16px,1.6vw,23px)}
.board-inner{grid-template-columns:1fr;grid-template-rows:minmax(108px,.85fr) minmax(0,2fr);gap:clamp(8px,1.2vh,14px);align-items:stretch;min-height:0}
.summary{grid-template-columns:clamp(70px,7vw,124px) minmax(0,1fr);min-height:0;gap:14px;align-content:center}
.summary.with-plate{grid-template-columns:clamp(60px,6vw,100px) minmax(0,1fr) clamp(138px,13vw,232px);gap:12px}
.plate{--plate-width:clamp(138px,13vw,232px)}
.dish-image{width:100%;height:clamp(70px,11vh,124px)}
.with-plate .dish-image{width:100%;height:clamp(60px,10vh,100px)}
.dish-name{font-size:clamp(18px,1.65vw,27px);padding:8px 12px}
.needs{gap:5px}
.recipe-entry{font-size:clamp(12px,1vw,16px);min-height:27px;padding:4px 6px}
.inventory-area{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-height:0}
.inventory-label{font-size:clamp(13px,1.1vw,17px);margin:0}
.cards{height:100%;grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1vw,16px);min-height:0}
.food-card{height:100%;min-height:0;padding:clamp(5px,1vh,12px);border-radius:16px}
.food-card img{height:100%;max-height:100%}
.selected-mark{width:23px;height:23px;font-size:16px;top:7px;right:7px}
.board-footer{margin:0;min-height:34px}
.board-note{font-size:clamp(12px,1vw,15px)}
.board-footer .button{min-height:36px;font-size:14px;padding:7px 20px}
.footer{padding:0}
.footer p{font-size:13px}
.footer .button{font-size:13px}
.phone-only{display:none}
.desktop-only{display:inline}
}
@media(min-width:860px) and (max-height:640px) and (hover:hover) and (pointer:fine){
.shell{padding:8px 0;gap:5px}
.topbar h1{font-size:25px}
.brand img{width:30px;height:30px}
.step{padding:6px 10px;font-size:12px}
.status{font-size:11px;min-height:15px}
.board{padding:10px;gap:6px}
.student{font-size:17px}
.board-inner{grid-template-rows:minmax(98px,.8fr) minmax(0,2fr);gap:6px}
.summary{gap:8px}
.summary.with-plate{grid-template-columns:55px minmax(0,1fr) 130px;gap:8px}
.plate{--plate-width:130px}
.dish-image,.with-plate .dish-image{height:60px}
.dish-name{font-size:17px;padding:5px 9px}
.recipe{gap:4px}
.recipe-entry{font-size:11px;min-height:22px;padding:2px 4px}
.inventory-area{gap:5px}
.inventory-label{font-size:12px}
.cards{gap:7px}
.board-footer{min-height:28px}
.board-footer .button{min-height:28px;padding:5px 15px;font-size:12px}
}
@media(max-width:420px){
.shell{width:calc(100% - 16px);padding-top:8px}
.brand img{width:29px;height:29px}
.actions{gap:4px}
.icon-button{width:31px;height:33px;border-radius:9px}
.icon-button svg{width:17px;height:17px}
h1{font-size:22px}
.round{font-size:11px;margin-top:3px}
.topbar{gap:5px;margin-bottom:8px}
.steps{gap:5px}
.step{font-size:11px;padding:7px 5px;border-radius:10px}
.step-number{font-size:10px;margin-right:3px}

.boards{gap:9px}
.board{padding:9px;border-radius:18px}
.student{font-size:16px;padding:4px 10px}
.board-header{gap:6px;min-height:26px;margin-bottom:6px}
.badge{font-size:10px;padding:4px 6px}
.count{font-size:14px}
.board-inner{gap:7px}
.summary{grid-template-columns:60px minmax(0,1fr);min-height:68px;gap:7px}
.summary.with-plate{grid-template-columns:50px minmax(0,1fr) 140px;gap:6px}
.dish-image{width:60px;height:65px}
.with-plate .dish-image{width:50px;height:58px}
.dish-name{font-size:15px;padding:6px 8px}
.recipe{gap:6px}
.recipe-entry{font-size:11px;min-height:21px;padding:2px 4px;gap:4px}
.recipe-entry .mini-check{width:10px;height:10px;font-size:8px}

<body>
<main class="shell" id="app" aria-label="Can you pass me? Cooking game">
<header class="topbar">
<div class="brand"><img src="./assets/ui/plate.png" alt="" width="39" height="39"><div><h1>Can you pass me?</h1><span class="round" id="round-label">Round 1 of 3</span></div></div>
<div class="actions">
<button class="icon-button" id="help-button" type="button" aria-label="How to play" title="How to play"></button>
<button class="icon-button" id="fullscreen-button" type="button" aria-label="Full screen" title="Full screen"></button>
</div>
</header>
<ol class="steps" aria-label="Game stages">
<li class="step current" id="choose-step"><span class="step-number">1</span>Choose ingredients</li>
<li class="step pass-step" id="pass-step"><span class="step-number">2</span>Ask and pass</li>
</ol>
<p class="status" id="status" role="status" aria-live="polite">Choose the ingredients for both dishes.</p>
<div class="boards" id="boards"></div>
<footer class="footer"><p>Two classmates · Three rounds</p><button class="button plain" id="restart-button" type="button">Restart</button></footer>
</main>
<template id="instructions-template">
<p>Играйте вдвоём на одном <span class="phone-only">телефоне</span><span class="desktop-only">компьютере</span>.<br><strong lang="en">Student A</strong> — <span class="phone-only">верхнее</span><span class="desktop-only">левое</span> поле. <strong lang="en">Student B</strong> — <span class="phone-only">нижнее</span><span class="desktop-only">правое</span>.</p>
<ol class="instructions">
<li><span class="instruction-number">1</span><span><strong>Выберите продукты.</strong><br>Каждый выбирает продукты для своего блюда по списку и нажимает <strong lang="en">Check</strong>.</span></li>
<li><span class="instruction-number">2</span><span><strong>Попроси продукт.</strong><br>Посмотри, какой продукт выделен оранжевым. Попроси его у одноклассника по опоре:<strong class="speaking-model" lang="en">Can you pass me the …, please?</strong></span></li>
<li><span class="instruction-number">3</span><span><strong>Передай продукт.</strong><br>Одноклассник отвечает:<strong class="speaking-model" lang="en">Sure. Here you are!</strong>Затем нажимает на нужную картинку на своём поле. Продукт переместится на твою тарелку.</span></li>
<li><span class="instruction-number">4</span><span><strong>Играйте по очереди.</strong><br>Теперь одноклассник просит, а ты передаёшь.</span></li>
<li><span class="instruction-number">5</span><span><strong>Приготовьте оба блюда.</strong><br>Когда оба блюда готовы, нажмите <strong lang="en">Next round</strong>. Всего <strong>3 раунда</strong>!</span></li>
</ol>
</template>
<dialog id="welcome-dialog" aria-labelledby="welcome-title">
<div class="dialog-content">
<div class="eyebrow" lang="ru">Игра для двоих</div>
<h2 id="welcome-title" lang="ru">Как играть</h2>
<div class="instruction-copy" lang="ru"></div>
<div class="dialog-actions"><button class="button orange" id="start-button" type="button">Let's cook!</button></div>
</div>
</dialog>
<dialog id="help-dialog" aria-labelledby="help-title">
<div class="dialog-content"><div class="eyebrow">How to play</div><h2 id="help-title" lang="ru">Как играть</h2>
<div class="instruction-copy" lang="ru"></div>
<form method="dialog" class="dialog-actions"><button class="button" value="close">Got it!</button></form></div>
</dialog>
<dialog id="reset-dialog" aria-labelledby="reset-title"><div class="dialog-content"><h2 id="reset-title">Start again?</h2><p>This will take you back to round 1.</p><div class="dialog-actions"><button class="button plain" id="cancel-reset" type="button">Cancel</button><button class="button orange" id="confirm-reset" type="button">Restart</button></div></div></dialog>
<dialog id="round-dialog" aria-labelledby="result-title"><div class="dialog-content" id="round-content"></div></dialog>
<script>
'use strict';
const DEFAULT_CONFIG={
title:'Can you pass me?',
foods:{
lemon:{label:'lemon',image:'foods/lemon.png'},beans:{label:'beans',image:'foods/beans.png'},mango:{label:'mango',image:'foods/mango.png'},butter:{label:'butter',image:'foods/butter.png'},coconut:{label:'coconut',image:'foods/coconut.png'},flour:{label:'flour',image:'foods/flour.png'},pineapple:{label:'pineapple',image:'foods/pineapple.png'},'olive-oil':{label:'olive oil',image:'foods/olive-oil.png'},sugar:{label:'sugar',image:'foods/sugar.png'},salt:{label:'salt',image:'foods/salt.png'},pepper:{label:'pepper',image:'foods/pepper.png'},tomato:{label:'tomato',image:'foods/tomato.png'}
},
rounds:[
{studentA:{dish:'Fruit salad',image:'dishes/fruit-salad.png',ingredients:['mango','pineapple','coconut']},studentB:{dish:'Tomato salad',image:'dishes/tomato-salad.png',ingredients:['tomato','olive-oil','salt']}},
{studentA:{dish:'Lemon cake',image:'dishes/lemon-cake.png',ingredients:['flour','butter','sugar','lemon']},studentB:{dish:'Bean soup',image:'dishes/bean-soup.png',ingredients:['beans','tomato','salt','pepper']}},
{studentA:{dish:'Pineapple cake',image:'dishes/pineapple-cake.png',ingredients:['pineapple','flour','butter','sugar']},studentB:{dish:'Fried beans',image:'dishes/fried-beans.png',ingredients:['beans','olive-oil','salt','pepper']}}
]};
function shuffled(items,random){const out=items.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));const value=out[i];out[i]=out[j];out[j]=value;}return out;}
class GameEngine{
constructor(config=DEFAULT_CONFIG,random=Math.random){this.config=config;this.random=random;this.startRound(0);}
recipe(player){return this.config.rounds[this.state.roundIndex][player===0?'studentA':'studentB'];}
needed(player){return this.recipe(player).ingredients;}
startRound(index){
if(!Number.isInteger(index)||index<0||index>=this.config.rounds.length)throw new Error('Invalid round');
const round=this.config.rounds[index],a=round.studentA.ingredients,b=round.studentB.ingredients;
if(a.length!==b.length||new Set(a.concat(b)).size!==a.length+b.length)throw new Error('Recipes must be balanced and distinct');
const leftovers=shuffled(Object.keys(this.config.foods).filter(id=>!a.includes(id)&&!b.includes(id)),this.random);
const distractorCount=6-a.length;
if(distractorCount<0||leftovers.length<distractorCount*2)throw new Error('Not enough ingredients');
const candidates=[shuffled(a.concat(leftovers.slice(0,distractorCount)),this.random),shuffled(b.concat(leftovers.slice(distractorCount,distractorCount*2)),this.random)];
this.state={roundIndex:index,phase:'choose',candidates,supplies:[candidates[1].slice(),candidates[0].slice()],selected:[[],[]],ready:[false,false],received:[[],[]],passed:[[],[]],requester:index%2,requested:null,turns:0};
}
toggleSelection(player,food){
const s=this.state;if(s.phase!=='choose'||s.ready[player]||!s.candidates[player].includes(food))return false;
const list=s.selected[player],index=list.indexOf(food);
if(index>=0){list.splice(index,1);return true;}
if(list.length>=this.needed(player).length)return false;
list.push(food);return true;
}
checkSelection(player){
const s=this.state;if(s.phase!=='choose'||s.ready[player])return {ok:false,reason:'locked'};
if(s.selected[player].length!==this.needed(player).length)return {ok:false,reason:'count'};
const wrong=s.selected[player].filter(id=>!this.needed(player).includes(id));
if(wrong.length)return {ok:false,reason:'ingredients',wrong};
s.ready[player]=true;
if(s.ready.every(Boolean)){s.phase='pass';s.requested=this.needed(s.requester)[0];return {ok:true,phaseChanged:true};}
return {ok:true,phaseChanged:false};
}
chooseRequest(player,food){
const s=this.state;if(s.phase!=='pass'||s.requester!==player||!this.needed(player).includes(food)||s.received[player].includes(food))return false;
s.requested=food;return true;
}
canGive(player,food){
const s=this.state;return s.phase==='pass'&&player===1-s.requester&&food===s.requested&&s.supplies[player].includes(food)&&!s.passed[player].includes(food);
}
give(player,food){
if(!this.canGive(player,food))return {ok:false};
const s=this.state,receiver=s.requester;
s.passed[player].push(food);s.received[receiver].push(food);s.turns++;
const remaining=p=>this.needed(p).filter(id=>!s.received[p].includes(id));
if(!remaining(0).length&&!remaining(1).length){s.phase='round-complete';s.requested=null;}
else{s.requester=remaining(1-receiver).length?1-receiver:receiver;s.requested=remaining(s.requester)[0];}
return {ok:true,receiver,food,roundComplete:s.phase==='round-complete'};
}
nextRound(){if(this.state.phase!=='round-complete'||this.state.roundIndex>=this.config.rounds.length-1)return false;this.startRound(this.state.roundIndex+1);return true;}
restart(){this.startRound(0);}
}
function mount(){
const engine=new GameEngine(),config=engine.config;
let busy=false,epoch=0,notice='',completedResults=false;
const $=id=>document.getElementById(id);
for(const holder of document.querySelectorAll('.instruction-copy'))holder.append($('instructions-template').content.cloneNode(true));
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const name=player=>'Student '+(player===0?'A':'B');
function el(tag,props,...children){
const n=document.createElement(tag);for(const [key,value] of Object.entries(props||{})){
if(key==='class')n.className=value;
else if(key==='text')n.textContent=value;
else if(key==='onClick')n.addEventListener('click',value);
else if(value!==false&&value!==null&&value!==undefined)n.setAttribute(key,value===true?'':String(value));
}
for(const child of children.flat(Infinity))if(child!==false&&child!==null&&child!==undefined)n.append(child instanceof Node?child:document.createTextNode(String(child)));
return n;
}
function picture(path,alt,className,options={}){
const img=el('img',{src:'./assets/'+path,alt:alt||'',class:className||'',draggable:'false',decoding:'async',...options});
img.addEventListener('error',()=>{img.style.visibility='hidden';img.setAttribute('data-unavailable','true');},{once:true});
return img;
}
function icon(id,svg){$(id).innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+svg+'</svg>';}
icon('help-button','<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.1-2.5 3.6"/><path d="M12 17h.01"/>');
icon('fullscreen-button','<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>');
function statusText(){
const s=engine.state;if(notice)return notice;
if(s.phase==='choose'){
if(s.ready[0])return 'Student A is ready. Student B: choose your ingredients.';
if(s.ready[1])return 'Student B is ready. Student A: choose your ingredients.';
return 'Choose the ingredients for both dishes.';
}
if(s.phase==='pass')return name(s.requester)+': ask for food. '+name(1-s.requester)+': pass the ingredient.';
return s.roundIndex===config.rounds.length-1?'All three rounds are complete!':'Both dishes are ready!';
}
function plate(player){
const s=engine.state,ingredients=engine.needed(player),received=s.received[player],finished=received.length===ingredients.length;
const area=el('div',{class:'plate','aria-label':name(player)+' plate: '+received.length+' of '+ingredients.length+' ingredients'});
area.append(picture('ui/plate.png','','plate-background'));
if(finished){area.append(picture(engine.recipe(player).image,engine.recipe(player).dish,'finished-dish'));return area;}
const slots=el('div',{class:'plate-items '+(ingredients.length===3?'three':'four')});
for(const food of ingredients){
const filled=received.includes(food),slot=el('div',{class:'plate-slot'+(filled?' filled':''),'data-food':food});
if(filled)slot.append(picture(config.foods[food].image,config.foods[food].label));
slots.append(slot);
}
area.append(slots);return area;
}
function renderBoard(player){
const s=engine.state,recipe=engine.recipe(player),selection=s.phase==='choose',received=s.received[player],n=recipe.ingredients.length;
const done=!selection&&received.length===n,requester=s.phase==='pass'&&s.requester===player;
const board=el('section',{class:'board'+(requester?' active':'')+(done?' done':''),'data-player':player,'aria-labelledby':'student-'+player});
let badgeText,badgeClass='';
if(selection){badgeText=s.ready[player]?'Ready!':'Choose '+n;badgeClass=s.ready[player]?'ready':'';}
else if(done){badgeText='Dish ready!';badgeClass='ready';}
else{badgeText=requester?'Your turn':'Pass the food';badgeClass=requester?'turn':'';}
const header=el('div',{class:'board-header'},el('h2',{class:'student',id:'student-'+player,text:name(player)}),el('span',{class:'badge '+badgeClass,text:badgeText}),el('span',{class:'count','aria-label':(selection?'Selected ':'Collected ')+(selection?s.selected[player].length:received.length)+' of '+n,text:(selection?s.selected[player].length:received.length)+' / '+n}));
const body=el('div',{class:'board-inner'});
const summary=el('div',{class:'summary'+(!selection?' with-plate':'')});
summary.append(picture(recipe.image,recipe.dish,'dish-image'));
const needs=el('div',{class:'needs','aria-label':'Ingredients for '+recipe.dish});
for(const food of recipe.ingredients){
const checked=selection?s.selected[player].includes(food):received.includes(food);
const targeted=requester&&s.requested===food;
const chip=el('button',{type:'button',class:'recipe-entry'+(checked?' checked':'')+(targeted?' requested':''),'data-food':food,'data-action':'request','data-player':player,disabled:selection||!requester||checked||busy,'aria-pressed':checked||targeted?'true':'false','aria-label':config.foods[food].label+(checked?', '+(selection?'selected':'received'):targeted?', ask for this ingredient':''),onClick:()=>{if(busy)return;if(engine.chooseRequest(player,food)){notice='';render();}}},el('span',{class:'mini-check','aria-hidden':'true',text:checked?'✓':targeted?'•':''}),el('span',{text:config.foods[food].label}));
needs.append(chip);
}
summary.append(el('div',{class:'recipe'},el('h3',{class:'dish-name',text:recipe.dish}),needs));
if(!selection)summary.append(plate(player));
const inventory=el('div',{class:'inventory-area'});
inventory.append(el('div',{class:'inventory-label',text:selection?'Choose for your dish':'Food for your classmate'}));
const grid=el('div',{class:'cards','aria-label':name(player)+(selection?' ingredient choices':' food cards')});
const cards=selection?s.candidates[player]:s.supplies[player];
for(const food of cards){
const selected=selection&&s.selected[player].includes(food),passed=!selection&&s.passed[player].includes(food);
const inactive=selection?s.ready[player]:s.phase!=='pass'||s.requester===player||passed;
const button=el('button',{type:'button',class:'food-card'+(selected?' selected':'')+(passed?' passed':'')+(!selection&&s.requester===player&&!passed?' waiting':''),'data-action':'card','data-player':player,'data-food':food,'aria-pressed':selection?(selected?'true':'false'):undefined,'aria-label':config.foods[food].label+(passed?', passed':''),disabled:inactive||busy,onClick:event=>onCard(player,food,event.currentTarget)});
button.append(picture(config.foods[food].image,config.foods[food].label));
if(selected||passed)button.append(el('span',{class:'selected-mark','aria-hidden':'true',text:'✓'}));
grid.append(button);
}
inventory.append(grid);
if(selection){
const note=s.ready[player]?'Waiting for your classmate.':'Select '+n+' ingredients.';
inventory.append(el('div',{class:'board-footer'},el('span',{class:'board-note',text:note}),el('button',{type:'button',class:'button','data-action':'check','data-player':player,disabled:s.ready[player]||s.selected[player].length!==n||busy,text:s.ready[player]?'Ready!':'Check',onClick:()=>onCheck(player)})));
}
body.append(summary,inventory);board.append(header,body);return board;
}
function render(){
const s=engine.state;
$('round-label').textContent='Round '+(s.roundIndex+1)+' of '+config.rounds.length;
$('choose-step').className='step'+(s.phase==='choose'?' current':' complete');
$('pass-step').className='step pass-step'+(s.phase==='choose'?'':' current');
$('choose-step').setAttribute('aria-current',s.phase==='choose'?'step':'false');
$('pass-step').setAttribute('aria-current',s.phase==='choose'?'false':'step');
$('status').textContent=statusText();
$('boards').replaceChildren(renderBoard(0),renderBoard(1));
$('restart-button').textContent=s.phase==='round-complete'?(s.roundIndex===config.rounds.length-1?'Play again':'Next round'):'Restart';
}
function shake(button){button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');window.setTimeout(()=>button.classList.remove('wrong'),400);}
function onCheck(player){
if(busy)return;const result=engine.checkSelection(player);
if(!result.ok){
notice=result.reason==='count'?'Choose all the ingredients first.':'Check your recipe and try again.';
$('status').textContent=statusText();
for(const id of result.wrong||[])document.querySelectorAll('.food-card[data-player="'+player+'"][data-food="'+id+'"]').forEach(shake);
return;
}
notice='';render();
}
async function fly(source,receiver,food){
const target=document.querySelector('.board[data-player="'+receiver+'"] .plate-slot[data-food="'+food+'"]'),img=source.querySelector('img');
if(!target||!img||reduced()||!img.complete||img.naturalWidth===0||typeof img.animate!=='function')return;
const from=img.getBoundingClientRect(),to=target.getBoundingClientRect();
if(!from.width||!from.height)return;
const clone=picture(config.foods[food].image,'','flying-food');
Object.assign(clone.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'});
document.body.append(clone);
try{
const dx=to.left+to.width/2-from.left-from.width/2,dy=to.top+to.height/2-from.top-from.height/2;
await clone.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale(.55)',opacity:1}],{duration:480,easing:'cubic-bezier(.25,.7,.3,1)',fill:'forwards'}).finished;
} catch(error){} finally{clone.remove();}
}
async function onCard(player,food,button){
if(busy)return;
if(engine.state.phase==='choose'){
if(!engine.toggleSelection(player,food)){notice='Choose '+engine.needed(player).length+' ingredients. Tap a selected card to change it.';$('status').textContent=notice;shake(button);return;}
notice='';render();return;
}
if(!engine.canGive(player,food)){notice='Try another ingredient.';$('status').textContent=notice;shake(button);return;}
busy=true;const token=epoch,receiver=engine.state.requester;
document.querySelectorAll('[data-action="card"],[data-action="request"]').forEach(b=>{b.disabled=true;});
try{
await fly(button,receiver,food);
if(token!==epoch)return;
const result=engine.give(player,food);notice='';busy=false;render();
if(result.roundComplete)showRoundResult();
} finally{if(token===epoch)busy=false;}
}
function showRoundResult(){
const s=engine.state,last=s.roundIndex===config.rounds.length-1;
completedResults=last;
const content=el('div',{});
content.append(el('span',{class:'confetti-star','aria-hidden':'true',text:'✦'}),el('h2',{id:'result-title',text:last?'Well done!':'Round '+(s.roundIndex+1)+' complete!'}),el('p',{text:last?'All your dishes are ready!':'You have cooked your dish!'}));
const pair=el('div',{class:'dish-pair'});
for(let p=0;p<2;p++)pair.append(el('div',{},picture(engine.recipe(p).image,engine.recipe(p).dish),el('h3',{text:engine.recipe(p).dish}),el('p',{text:name(p)})));
content.append(pair);
const buttons=el('div',{class:'dialog-actions'},el('button',{type:'button',class:'button plain',text:'Close',onClick:()=>$('round-dialog').close()}),el('button',{type:'button',class:'button orange',id:'next-round-button',text:last?'Play again':'Next round',onClick:()=>{
$('round-dialog').close();epoch++;notice='';if(last){engine.restart();completedResults=false;}else engine.nextRound();render();window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});
}}));
content.append(buttons);$('round-content').replaceChildren(...content.childNodes);$('round-dialog').showModal();
}
$('start-button').addEventListener('click',()=>$('welcome-dialog').close());
$('help-button').addEventListener('click',()=>$('help-dialog').showModal());
$('restart-button').addEventListener('click',()=>{
if(busy)return;
if(engine.state.phase==='round-complete'){epoch++;if(engine.state.roundIndex===config.rounds.length-1)engine.restart();else engine.nextRound();completedResults=false;notice='';render();window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});}
else $('reset-dialog').showModal();
});
$('cancel-reset').addEventListener('click',()=>$('reset-dialog').close());
$('confirm-reset').addEventListener('click',()=>{epoch++;busy=false;notice='';completedResults=false;engine.restart();$('reset-dialog').close();render();window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});});
$('fullscreen-button').addEventListener('click',async()=>{
try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else{notice='Use your browser menu to open the game full screen.';$('status').textContent=notice;}}catch(error){notice='Full screen is not available here.';$('status').textContent=notice;}
});
document.addEventListener('fullscreenchange',()=>{const active=Boolean(document.fullscreenElement);$('fullscreen-button').setAttribute('aria-label',active?'Exit full screen':'Full screen');$('fullscreen-button').title=active?'Exit full screen':'Full screen';});
render();$('welcome-dialog').showModal();
}
if(typeof module!=='undefined'&&module.exports)module.exports={GameEngine,DEFAULT_CONFIG,shuffled};
if(typeof document!=='undefined'){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();}
</script>
